name: Deploy

# GitHub Pages, from the Actions source. The build is `base: './'`, so the same
# output works at a domain root and under the repository subpath Pages serves.

on:
  push:
    branches: [main]
  # Re-runnable without an empty commit.
  workflow_dispatch:

# One deploy at a time, never cancelled midway: a half-finished deploy of a
# static site serves a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # The same gate as CI: nothing reaches users that would fail review.
      - name: Gate
        run: npm run gate

      # Pages serves 404.html for unknown paths; the app has one page.
      - name: Single-page fallback
        run: cp dist/index.html dist/404.html

      # Otherwise Jekyll drops files and directories beginning with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
